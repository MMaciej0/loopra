services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/gpx/node_modules
    command: "tail -f /dev/null"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://loopra:loopra@postgres:5432/loopra
      REDIS_URL: redis://redis:6379
      PORT: 8080
      TRUSTED_PROXIES: loopback,uniquelocal
    env_file:
      - .env

  web:
    container_name: web
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    command: "tail -f /dev/null"
    environment:
      API_URL: ${API_URL}
      MAPTILER_KEY: ${MAPTILER_KEY}
      APP_ENV: ${APP_ENV}
      APP_URL: ${APP_URL}

  postgres:
    container_name: loopra-postgres
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: loopra
      POSTGRES_PASSWORD: loopra
      POSTGRES_DB: loopra
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopra -d loopra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: loopra-redis
    image: redis:8-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
