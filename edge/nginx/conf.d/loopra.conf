resolver 127.0.0.11 valid=10s;
server_tokens off;

server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    server_name staging.loopra.cc loopra.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name loopra.cc;

    ssl_certificate     /etc/letsencrypt/live/staging.loopra.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.loopra.cc/privkey.pem;

    return 302 https://staging.loopra.cc$request_uri;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
