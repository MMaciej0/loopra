server {
    listen 443 ssl;
    http2 on;
    server_name staging.loopra.cc;

    ssl_certificate     /etc/letsencrypt/live/staging.loopra.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.loopra.cc/privkey.pem;

    client_max_body_size 11m;

    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    set $staging_web http://staging-web:3000;
    set $staging_api http://staging-api:8080;

    location = /robots.txt {
        alias /usr/share/nginx/robots.txt;
        default_type text/plain;
    }

    location = /auth/google {
        proxy_pass $staging_api;
    }

    location = /auth/google/callback {
        proxy_pass $staging_api;
    }

    location = /api-health {
        proxy_pass $staging_api/health;
    }

    location / {
        proxy_pass $staging_web;
    }
}
