name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      ref:
        description: Branch, tag or SHA
        required: true
        type: string
        default: master

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.ref }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve tag
        id: tag
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: scripts/build-images.sh ${{ steps.tag.outputs.tag }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: scp docker-compose-${{ inputs.environment }}.yml scripts/deploy.sh "deploy@$DEPLOY_HOST:/srv/loopra/${{ inputs.environment }}/"

      - name: Run deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh "deploy@$DEPLOY_HOST" "/srv/loopra/${{ inputs.environment }}/deploy.sh ${{ inputs.environment }} ${{ steps.tag.outputs.tag }}"
