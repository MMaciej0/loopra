name: loopra-test

services:
  postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: loopra
      POSTGRES_PASSWORD: loopra
      POSTGRES_DB: loopra
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # -h forces a TCP probe: without it pg_isready uses the unix socket, which
      # answers during initdb while listen_addresses is still empty
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U loopra -d loopra"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
