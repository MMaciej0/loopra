name: loopra-edge

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./edge/nginx/robots.txt:/usr/share/nginx/robots.txt:ro
      - ./edge/certbot/www:/var/www/certbot:ro
      - ./edge/certbot/conf:/etc/letsencrypt:ro
    networks:
      - edge
    command:
      [
        "/bin/sh",
        "-c",
        "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'",
      ]

  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    volumes:
      - ./edge/certbot/www:/var/www/certbot
      - ./edge/certbot/conf:/etc/letsencrypt
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done",
      ]

networks:
  edge:
    external: true
